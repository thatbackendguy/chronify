name: Release

# Pushing a version tag (e.g. v1.0.0) tests, builds and publishes a GitHub
# Release with binaries for macOS, Linux and Windows.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test -race ./...

      - name: Build
        run: scripts/build-release.sh "$GITHUB_REF_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Chronify $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
